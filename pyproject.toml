[project]
name = "hub"
version = "0.1.0"
description = "Rent Roll & Maintenance Hub: property-operations back end on FastAPI and SQL Server"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "pyodbc",
    "alembic",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hub"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external APIs; run with -m live"]
addopts = "-m 'not live'"
