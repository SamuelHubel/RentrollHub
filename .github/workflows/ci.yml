name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: Ci_Passw0rd!
      DATABASE_URL: mssql+pyodbc://sa:Ci_Passw0rd!@localhost:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    services:
      db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ensure ODBC Driver 18
        run: |
          if ! odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -sSL -O https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest --cov=hub --cov-report=term-missing
